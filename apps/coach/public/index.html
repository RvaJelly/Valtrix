<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* The app's background from the first frame, so the page never flashes white. */
      html,
      body {
        background: #0A1630;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The Voltrix V while the app starts; the app fades it out when it is ready. */
      #voltrix-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        z-index: 10;
        transition: opacity 200ms ease;
      }
      /* A visible focus ring for keyboard users. */
      [role='button']:focus-visible,
      [role='tab']:focus-visible,
      a:focus-visible {
        outline: 2px solid #ff5b14;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="voltrix-splash" aria-hidden="true">
      <svg viewBox="-25 -45 135.8 170" width="56" height="70">
        <path fill="#FFFFFF" d="M0,0 L22,0 L51,100 L29,100 Z" />
        <path fill="#FF5B14" d="M63.8,-20 L85.8,-20 L51,100 L29,100 Z" />
      </svg>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

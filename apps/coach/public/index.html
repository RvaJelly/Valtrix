<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The brand fonts, Latin subsets (about 90 KB in all, SIL Open Font License). The page draws
         at once in the system font and swaps these in, so a slow connection never holds the app. -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ChakraPetch-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ChakraPetch-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The page and splash follow the theme saved on this device, so a light theme never starts navy. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('valtrix.settings') || '{}');
          var light =
            s.appearance === 'light' ||
            (s.appearance === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.setAttribute('data-scheme', 'light');
        } catch (e) {}
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      @font-face {
        font-family: 'Inter-Regular';
        src: url('/fonts/Inter-Regular.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter-Medium';
        src: url('/fonts/Inter-Medium.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter-SemiBold';
        src: url('/fonts/Inter-SemiBold.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'ChakraPetch-SemiBold';
        src: url('/fonts/ChakraPetch-SemiBold.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'ChakraPetch-Bold';
        src: url('/fonts/ChakraPetch-Bold.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* The app's background from the first frame, so the page never flashes white. */
      html,
      body {
        background: #0A1630;
      }
      /* The light theme, when it is the one saved (see the script above). */
      html[data-scheme='light'],
      html[data-scheme='light'] body {
        background: #F5F4F2;
      }
      html[data-scheme='light'] #voltrix-splash .v-left {
        fill: #0E0E0F;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The Voltrix V while the app starts; the app fades it out when it is ready. */
      #voltrix-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: inherit;
        z-index: 10;
        transition: opacity 200ms ease;
      }
      /* A visible focus ring for keyboard users. */
      [role='button']:focus-visible,
      [role='tab']:focus-visible,
      a:focus-visible {
        outline: 2px solid #ff5b14;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="voltrix-splash" aria-hidden="true">
      <svg viewBox="-25 -45 135.8 170" width="56" height="70">
        <path class="v-left" fill="#FFFFFF" d="M0,0 L22,0 L51,100 L29,100 Z" />
        <path fill="#FF5B14" d="M63.8,-20 L85.8,-20 L51,100 L29,100 Z" />
      </svg>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

# Supabase CLI settings. Anything not listed here uses the CLI's defaults.
# project_id only names the local development stack; the hosted project is
# jmnmqxhkcpcdnwlcoiuq.
project_id = "voltrix"

# The hourly job in the database calls this function with a secret key instead of a login (see
# migrations/20261008170000_clean_expired_stories.sql), so it must run without
# the JWT check; the function checks the key itself. `supabase functions deploy` reads this.
# Deploying another way (the dashboard or an MCP tool) needs JWT verification
# turned off by hand.
[functions.clean-expired-stories]
verify_jwt = false

# Calendar apps (Google, Apple, Outlook) fetch the link without logging in: the 64-character token
# in the link is the key, and calendar_feed() checks it. `supabase functions deploy` reads this;
# deploying another way (the dashboard or an MCP tool) needs JWT verification turned off by hand.
[functions.calendar-feed]
verify_jwt = false

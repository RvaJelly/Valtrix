# Supabase CLI settings. Anything not listed here uses the CLI's defaults.
# project_id only names the local development stack; the hosted project is
# jmnmqxhkcpcdnwlcoiuq.
project_id = "voltrix"

# The hourly job in the database calls this function with no login (see
# migrations/20261008170000_clean_expired_stories.sql), so it must run without
# the JWT check or every call gets a 401. `supabase functions deploy` reads this.
# Deploying another way (the dashboard or an MCP tool) needs JWT verification
# turned off by hand.
[functions.clean-expired-stories]
verify_jwt = false
